<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ titulo }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="container small">
  <section class="card">
    <h1>{{ titulo }}</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" novalidate>
      <label>Nombre
        <input name="nombre" maxlength="80" required value="{{ usuario.get('nombre','') }}">
      </label>
      <label>Correo
        <input type="email" name="correo" maxlength="120" required value="{{ usuario.get('correo','') }}">
      </label>
      <label>Edad
        <input type="number" name="edad" min="1" max="120" required value="{{ usuario.get('edad','') }}">
      </label>
      <button type="submit" class="button">Guardar</button>
      <a class="button secondary" href="{{ url_for('index') }}">Cancelar</a>
    </form>
  </section>
</main>
</body>
</html>
